name: Build and push RunPod image

on:
  push:
    branches:
      - dev
    paths:
      - "infra/environments/runpod/Dockerfile"
      - "pyproject.toml"
      - "README.md"
      - "twitter/**"
      - "configs/**"
      - ".github/workflows/build-push-runpod.yml"

env:
  DOCKER_RUNPOD_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/twitter-sentiment
  DOCKER_RUNPOD_CACHE_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/twitter-sentiment:buildcache

jobs:
  push_runpod_image:
    name: Push RunPod Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract tags and labels from github repo metadata (e.g. branch, commit SHA, etc.)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_RUNPOD_IMAGE_NAME }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/environments/runpod/Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.DOCKER_RUNPOD_CACHE_IMAGE_NAME }}
          cache-to: type=registry,ref=${{ env.DOCKER_RUNPOD_CACHE_IMAGE_NAME }},mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.DOCKER_RUNPOD_IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
