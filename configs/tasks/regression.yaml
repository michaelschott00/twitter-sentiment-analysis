model:
  class_path: twitter.modules.SingleTaskModule
  init_args:
    task: "reg"
data:
  init_args:
    labels: "reg"
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: "MeanSquaredError"
        mode: "min"
        patience: 3
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        # Weights-only drops the Adam optimizer state, shrinking the checkpoint
        # ~3x. That bundle is what the Azure ML MLflow upload flushed, so this
        # avoids the registration timeout. `load_from_checkpoint` still works:
        # Lightning keeps the hyperparameters in a weights-only checkpoint.
        save_weights_only: true
        monitor: "MeanSquaredError"
        mode: "min"
