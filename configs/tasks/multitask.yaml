model:
  class_path: twitter.modules.MultiTaskModule
  init_args:
    # null -> homoscedastic uncertainty weighting (learned task balance);
    # set a float for the legacy fixed blend: loss_weight * reg + (1 - loss_weight) * clf
    loss_weight: null
data:
  init_args:
    labels: "both"
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        # Weights-only drops the Adam optimizer state, shrinking the checkpoint
        # ~3x. That bundle is what the Azure ML MLflow upload flushed, so this
        # avoids the registration timeout. `load_from_checkpoint` still works:
        # Lightning keeps the hyperparameters in a weights-only checkpoint.
        save_weights_only: true
        monitor: "MulticlassF1Score"
        mode: "max"
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        save_weights_only: true
        monitor: "MeanSquaredError"
        mode: "min"
