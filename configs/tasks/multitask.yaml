model:
  class_path: twitter.modules.MultiTaskModule
  init_args:
    # null -> homoscedastic uncertainty weighting (learned task balance);
    # set a float for the legacy fixed blend: loss_weight * reg + (1 - loss_weight) * clf
    loss_weight: null
data:
  init_args:
    labels: "both"
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: "MulticlassF1Score"
        mode: "max"
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: "MeanSquaredError"
        mode: "min"
