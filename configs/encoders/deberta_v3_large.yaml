# lightning.pytorch==2.0.1.post0
model:
  init_args:
    encoder:
      class_path: twitter.models.TransformerEncoder
      init_args:
        name: "microsoft/deberta-v3-large"
        pooling: "cls"
        gradient_checkpointing: true
    # Official DeBERTaV3-large GLUE recipe uses ~6e-6 for the encoder;
    # the randomly initialized head keeps the higher LR.
    lr: {"encoder": 6.0e-06, "head": 3.0e-04}
    weight_decay: 0.01
