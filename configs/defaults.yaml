# lightning.pytorch==2.0.1.post0
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  # bf16 needs Ampere+ GPUs (DeBERTa-v3/ModernBERT also train best on it).
  # For older GPUs override on the CLI, e.g.:
  #   --trainer.precision 16-mixed   # pre-Ampere with Tensor Cores (e.g. V100/T4)
  #   --trainer.precision 32-true    # fallback when mixed precision is unstable
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: twitter-sentiment
      # tracking_uri is intentionally omitted. Lightning's MLFlowLogger
      # defaults it to os.getenv("MLFLOW_TRACKING_URI") (azureml://... on the
      # RunPod pod / AML job, unset locally -> file:./mlruns). Passing
      # tracking_uri: null explicitly would defeat that default: Lightning
      # treats any falsy value as "no URI" and falls back to file:./mlruns,
      # silently discarding the pod's MLFLOW_TRACKING_URI. Do NOT template
      # ${...} here either: with parser_mode=omegaconf that would be parsed
      # as a config interpolation.
      tags: { model: sbert, task: clf }
      # log_model is disabled on purpose. Lightning's MLFlowLogger uploads the
      # ModelCheckpoint in finalize() *before* it calls set_terminated(); if
      # that upload fails (Azure ML rejects/times out the multi-GB duplicate of
      # a checkpoint already uploaded inside `registered_model`), finalize
      # raises before terminating the run and the run is left RUNNING forever.
      # twitter.modules.on_train_end already packages and registers the best
      # checkpoint (with its `registered_model` artifact), so the raw duplicate
      # is redundant. Keep this false so finalize only marks the run finished.
      log_model: false
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: null
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
