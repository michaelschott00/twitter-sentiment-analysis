services:
  dev:
    build:
      context: .
      dockerfile: dev/dev.Dockerfile
    volumes:
      - .:/workspace
      - ~/.cache/pre-commit:/home/agent/.cache/pre-commit
      - ~/.config/opencode:/home/agent/.config/opencode
      - ~/.local/share/opencode:/home/agent/.local/share/opencode
      - ~/.local/state/opencode:/home/agent/.local/state/opencode

  runpod-mcp:
    build:
      context: .
      dockerfile: dev/runpod-mcp.Dockerfile
    ports:
      - 8001:8001
    env_file: ../.runpod.env
    environment:
      - PORT=8001

  azure-mcp:
    image: mcr.microsoft.com/azure-sdk/azure-mcp:latest
    command: ["server", "start", "--transport", "http", "--outgoing-auth-strategy", "UseHostingEnvironmentIdentity", "--dangerously-disable-http-incoming-auth"]
    env_file: ../.azure.env
    ports:
      - 8002:8002
    environment:
      - ASPNETCORE_URLS=http://+:8002

  github-mcp:
    build:
      context: .
      dockerfile: dev/github-mcp.Dockerfile
    env_file: ../.github.env
    ports:
      - 8082:8082
    environment:
      - PORT=8082
