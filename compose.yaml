services:
  dev:
    build: .
    volumes:
      - .:/workspace
      - ~/.hermes:/home/agent/.hermes
      - ~/.config/opencode:/home/agent/.config/opencode
      - ~/.local/share/opencode:/home/agent/.local/share/opencode
      - ~/.local/state/opencode:/home/agent/.local/state/opencode
    environment:
      - HERMES_HOME=/home/agent/.hermes
      - AGENT_VAULT_ADDR=http://vault:14321
      - AGENT_VAULT_TOKEN=${AGENT_VAULT_TOKEN}
      - AGENT_VAULT_VAULT=default
      - GITHUB_TOKEN="__github_token__"
    # command: sleep infinity
    # entrypoint: ""

  vault:
    image: infisical/agent-vault
    environment:
      - AGENT_VAULT_MASTER_PASSWORD=${AGENT_VAULT_MASTER_PASSWORD}
    ports:
      - "14321:14321"
      - "14322:14322"
    volumes:
      - agent-vault-data:/data

volumes:
  agent-vault-data:
