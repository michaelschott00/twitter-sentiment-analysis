services:
  dev:
    build:
      context: .
      dockerfile: dev/dev.Dockerfile
    volumes:
      - .:/workspace
      - ~/.cache/pre-commit:/home/agent/.cache/pre-commit
      - ~/.config/opencode:/home/agent/.config/opencode
      - ~/.local/share/opencode:/home/agent/.local/share/opencode
      - ~/.local/state/opencode:/home/agent/.local/state/opencode
      - ~/.cache/torch/:/home/agent/.cache/torch/
      - ~/.cache/huggingface/:/home/agent/.cache/huggingface/
      - worktrees:/home/agent/worktrees
    environment:
      - GIT_AUTHOR_NAME=agent
      - GIT_AUTHOR_EMAIL=agent@example.com
      - GIT_COMMITTER_NAME=agent
      - GIT_COMMITTER_EMAIL=agent@example.com

  # Single authenticated exec gateway. Secrets enter ONLY here via env_file;
  # the agent (dev) container holds none. Add new creds by adding an env_file
  # line; add new commands in dev/tools.yaml (no new service required).
  tool-gateway:
    build:
      context: .
      dockerfile: dev/tool-gateway/Dockerfile
    volumes:
      - .:/workspace
      # SkyPilot's RunPod cloud (and the runpod SDK it drives) read the API key
      # from ~/.runpod/config.toml, not from RUNPOD_API_KEY. Mount the host file
      # read-only at that exact path. The file must exist before
      # `docker compose up` (Docker would otherwise create it as a directory)
      # and be readable by uid 1000 (the gateway's agent user).
      - ../.runpod/config.toml:/home/agent/.runpod/config.toml:ro
      # Persist SkyPilot's client/server state (clusters, managed jobs) across
      # gateway restarts, so tracked RunPod pods are not orphaned.
      - sky-state:/home/agent/.sky
    ports:
      - 8004:8004
    env_file:
      - ../.github.env
      - ../.runpod.env
      - ../.azure.env
      - ../.dev.env
    environment:
      - PORT=8004

volumes:
  worktrees:
  sky-state:
