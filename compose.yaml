services:
  dev:
    build:
      context: .
      dockerfile: dev/dev.Dockerfile
    volumes:
      - .:/workspace
      - ~/.cache/pre-commit:/home/agent/.cache/pre-commit
      - ~/.hermes:/home/agent/.hermes
      - ~/.config/opencode:/home/agent/.config/opencode
      - ~/.local/share/opencode:/home/agent/.local/share/opencode
      - ~/.local/state/opencode:/home/agent/.local/state/opencode
    environment:
      - HERMES_HOME=/home/agent/.hermes

  sidecar:
    build:
      context: .
      dockerfile: dev/sidecar.Dockerfile
    ports:
      - 8000:8000
    volumes:
      - .:/workspace
      - ${SSH_AUTH_SOCK}:/ssh-agent
    environment:
      - ARM_SUBSCRIPTION_ID=${ARM_SUBSCRIPTION_ID}
      - ARM_TENANT_ID=${ARM_TENANT_ID}
      - AZCOPY_AUTO_LOGIN_TYPE=SPN
      - AZCOPY_TENANT_ID=${AZCOPY_TENANT_ID}
      - AZCOPY_SPA_APPLICATION_ID=${AZCOPY_SPA_APPLICATION_ID}
      - AZCOPY_SPA_CLIENT_SECRET=${AZCOPY_SPA_CLIENT_SECRET}
      - SSH_AUTH_SOCK=/ssh-agent
      - AZUREML_WORKSPACE_NAME=mlw-twitter-sentiment
      - AZUREML_RESOURCE_GROUP=rg-twitter-ml
