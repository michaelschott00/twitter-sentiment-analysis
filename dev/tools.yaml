# Single source of truth for gateway tools.
# Adding a command = append an entry here. No server.py change needed.
# creds: env vars the broker passes to this tool ONLY (least-privilege).
# Secrets come from compose env_file; agent container never sees them.
#
# Every tool takes full argv (incl. executable), e.g.
#   azml_job_submit(argv=["az", "ml", "job", "create", "--file", "job.yaml"])
# Schema per tool:
#   name, description, creds, needs_az_login, base_argv (enforced prefix),
#   help_argv ([--help]), argv_allow_regex (catch-all over trailing args),
#   params: [{names (flag tokens) XOR positional (1-based index or list),
#             allow_regex (on the value), path (confine value to workspace),
#             default/default_from/default_flag (named flags only)}].
# Path confinement is opt-in per argument via `path: true`.
# Unlisted flags and positionals are allowed (globals only).
defaults:
  resource_group: rg-twitter-ml
  workspace: mlw-twitter-sentiment

tools:

  # GitHub

  - name: gh_pr
    description: GitHub CLI passthrough for pr subcommands.
    creds: [GH_TOKEN]
    base_argv: [gh, pr]

  - name: gh_workflow
    description: GitHub CLI passthrough for workflow.
    creds: [GH_TOKEN]
    base_argv: [gh, workflow]

  - name: gh_run
    description: GitHub CLI passthrough for run.
    creds: [GH_TOKEN]
    base_argv: [gh, run]

  # Git

  - name: git_push
    description: Git push to GitHub remote.
    creds: [GH_TOKEN]
    base_argv: [git, push]

  # Azure ML

  - name: azml_job_submit
    description: Submit any AML yaml job file (generic, not tied to infra/jobs).
    creds: [AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
    needs_az_login: true
    base_argv: [az, ml, job, create]
    params:
      - names: [--file, -f]
        path: true
      - names: [-g, --resource-group]
        allow_regex: "^rg-[a-z0-9-]+$"
        default_from: resource_group
        default_flag: -g
      - names: [-w, --workspace]
        allow_regex: "^[a-zA-Z0-9][a-zA-Z0-9_-]{1,60}$"
        default_from: workspace
        default_flag: -w

  - name: azml_job_list
    description: List AML jobs in the workspace.
    creds: [AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
    needs_az_login: true
    base_argv: [az, ml, job, list]
    params:
      - names: [-g, --resource-group]
        allow_regex: "^rg-[a-z0-9-]+$"
        default_from: resource_group
        default_flag: -g
      - names: [-w, --workspace]
        allow_regex: "^[a-zA-Z0-9][a-zA-Z0-9_-]{1,60}$"
        default_from: workspace
        default_flag: -w

  - name: azml_model_list
    description: List AML models in the workspace.
    creds: [AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
    needs_az_login: true
    base_argv: [az, ml, model, list]
    params:
      - names: [-g, --resource-group]
        allow_regex: "^rg-[a-z0-9-]+$"
        default_from: resource_group
        default_flag: -g
      - names: [-w, --workspace]
        allow_regex: "^[a-zA-Z0-9][a-zA-Z0-9_-]{1,60}$"
        default_from: workspace
        default_flag: -w

  # mlflow

  - name: mlflow_runs
    description: Passthrough for `mlflow runs`.
    creds: [MLFLOW_TRACKING_URI, AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
    base_argv: [mlflow, runs]

  - name: mlflow_artifacts
    description: Passthrough for `mlflow artifacts`.
    creds: [MLFLOW_TRACKING_URI, AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
    base_argv: [mlflow, artifacts]

  - name: mlflow_experiments
    description: Passthrough for `mlflow experiments`.
    creds: [MLFLOW_TRACKING_URI, AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
    base_argv: [mlflow, experiments]

  # azcopy

  - name: azcopy_copy
    description: AzCopy copy passthrough constrained to blob storage URLs.
    creds: [AZCOPY_AUTO_LOGIN_TYPE, AZCOPY_TENANT_ID, AZCOPY_SPA_APPLICATION_ID, AZCOPY_SPA_CLIENT_SECRET]
    base_argv: [azcopy, copy]
    argv_allow_regex: "^(https://.*\\.blob\\.core\\.windows\\.net/.*|[^:]+)$"
    params:
      - positional: [1, 2]
        path: true

  - name: azcopy_list
    description: AzCopy list passthrough constrained to blob storage URLs.
    creds: [AZCOPY_AUTO_LOGIN_TYPE, AZCOPY_TENANT_ID, AZCOPY_SPA_APPLICATION_ID, AZCOPY_SPA_CLIENT_SECRET]
    base_argv: [azcopy, list]
    argv_allow_regex: "^(https://.*\\.blob\\.core\\.windows\\.net/.*|[^:]+)$"
    params:
      - positional: 1
        path: true

  # RunPod

  - name: runpodctl_pod
    description: -<
      Passthrough for `runpodctl pod`.
      The template `twitter-sentiment-gpu` is custom built and available for training.
    creds: [RUNPOD_API_KEY]
    base_argv: [runpodctl, pod]

  - name: runpodctl_template
    description: -<
      Passthrough for `runpodctl template`.
      The value for registry-auth-id is accessible from env var $RUNPOD_REGISTRY_AUTH_ID.
      Secrets stored on runpod can be injected as environment variables prefixed with RUNPOD_SECRET_ (e.g. `API_KEY={{ RUNPOD_SECRET_openai_key }}`).
    creds: [RUNPOD_API_KEY, RUNPOD_REGISTRY_AUTH_ID]
    base_argv: [runpodctl, template]

  - name: runpodctl_gpu_list
    description: List available gpu types and their availability on RunPod.
    creds: [RUNPOD_API_KEY]
    base_argv: [runpodctl, gpu, list]
